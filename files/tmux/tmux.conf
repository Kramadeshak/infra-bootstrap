# Override terminals to set the colors for any xterm
set-option -sa terminal-overrides ",xterm*:Tc"
# Turn on mouse interactivity
set -g mouse on

# Reconfigure the default prefix key to Ctrl Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Ctrl+Shift pane navigation
bind -n C-J select-pane -D
bind -n C-K select-pane -U
bind -n C-H select-pane -L
bind -n C-L select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"



# Chromatic Engineer — tmux palette
set -g status on
set -g status-position bottom
set -g status-style "bg=#17191D,fg=#E7E4DC"
set -g message-style "bg=#24272D,fg=#E7E4DC"
set -g message-command-style "bg=#24272D,fg=#E8AA55"
set -g pane-border-style "fg=#41464F"
set -g pane-active-border-style "fg=#32B875"
set -g display-panes-active-colour "#32B875"
set -g display-panes-colour "#5D636D"

# Status bar
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#17191D,bg=#32B875,bold] #S #[default] "
set -g window-status-format "#[fg=#5D636D] #I:#W "
set -g window-status-current-format "#[fg=#17191D,bg=#32B875,bold] #I:#W "
set -g window-status-separator ""

# Activity and alerts
set -g window-status-activity-style "fg=#E8AA55,bold"
set -g window-status-bell-style "fg=#17191D,bg=#EB5C5C,bold"
set -g clock-mode-colour "#A58AE8"
set -g mode-style "bg=#A58AE8,fg=#17191D,bold"

# True-color support
set -as terminal-features ",xterm-ghostty:RGB"

